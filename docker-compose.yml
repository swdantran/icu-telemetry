services:
  timescaledb:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: icu
      POSTGRES_PASSWORD: icu_dev
      POSTGRES_DB: icu
    ports: ["5432:5432"]
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - tsdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  tsdata: